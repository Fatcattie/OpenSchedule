# ============================================================
# OpenSchedule 本地开发栈（Docker Compose v2 格式，无 version 字段）
# 方案 chapter_02 §2 + B1：一键本地环境 pg + redis + minio + api + web + ai
# 用法（仓库根目录，先 cp .env.example .env）：
#   pnpm docker:up        # 等价：docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#   pnpm docker:infra     # 仅起基础设施（日常本地开发：pg + redis + minio）
# 端口约定：api 3000 / web 5173 / ai 8300 / pg 5432 / redis 6379 / minio 9000(S3)+9001(控制台)
# 安全（L-2）：宿主端口默认只绑定 127.0.0.1（开发默认口令、Redis 无鉴权不暴露到局域网）；
#   真机调试需局域网访问时在 .env 设 DEV_BIND_HOST=0.0.0.0（仅可信网络）。
#   可观测性（profile=observability）：prometheus 9090 / grafana 3001
# 网络地址覆盖：容器内各服务通过服务名互访（postgres/redis/minio/api/ai），
#   与根 .env 中的 localhost 地址无关（compose environment 优先于 env_file）。
# ============================================================
name: openschedule

services:
  # ---------- PostgreSQL 16（主存储；方案：PG 全文搜索 tsvector/pg_trgm） ----------
  postgres:
    image: postgres:16-alpine
    container_name: os-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openschedule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openschedule}
      POSTGRES_DB: ${POSTGRES_DB:-openschedule}
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 初始化脚本（扩展等）仅在数据卷首次初始化时执行；改脚本后需 down -v 重置
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openschedule} -d ${POSTGRES_DB:-openschedule}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- Redis 7（BullMQ 队列 + zset 延迟提醒 + WS 广播） ----------
  redis:
    image: redis:7-alpine
    container_name: os-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- MinIO（S3 兼容对象存储，本地模拟；生产切 OSS/COS 只改配置） ----------
  minio:
    # TODO：CI/生产环境固定具体 RELEASE tag（latest 便于开发，发布前锁定）
    image: minio/minio:latest
    container_name: os-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:9000:9000"   # S3 API
      - "${DEV_BIND_HOST:-127.0.0.1}:9001:9001"   # Web 控制台
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- 主后端（NestJS 模块化单体，唯一写库方） ----------
  api:
    build:
      context: ..                       # 构建上下文 = 仓库根目录（pnpm workspace 需整仓依赖图）
      dockerfile: services/api/Dockerfile
    container_name: os-api
    env_file:
      # 根目录 .env（cp .env.example 而来）；缺失不阻塞启动（compose v2 语法）
      - path: ../.env
        required: false
    environment:
      # 容器网络内覆盖：宿主变量中的 localhost 一律换成服务名
      APP_PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-openschedule}:${POSTGRES_PASSWORD:-openschedule}@postgres:5432/${POSTGRES_DB:-openschedule}?schema=public
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/${STORAGE_BUCKET:-openschedule}
      AI_SERVICE_URL: http://ai:8300
      # R9：Prometheus 抓取端点（默认 true；'false' 时 /metrics 404，会触发 ApiDown 告警）
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 健康检查继承自 services/api/Dockerfile（依赖 GET /health 端点，B1 验收点）

  # ---------- 前端 SPA（React 19 + Vite；容器内跑 dev server，HMR 经端口映射） ----------
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: os-web
    environment:
      # 浏览器侧 API 地址（浏览器在宿主机，走宿主端口）
      VITE_API_BASE_URL: http://localhost:3000
      VITE_USE_MOCK: "false"
      # Vite 代理目标（容器内服务名）：apps/web/vite.config.ts 的 proxy 请读取该变量
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:5173:5173"
    depends_on:
      api:
        condition: service_healthy

  # ---------- AI 服务（Python FastAPI + LangGraph；永不直连业务库，只回调主服务） ----------
  ai:
    build:
      context: ..
      dockerfile: services/ai/Dockerfile
    container_name: os-ai
    env_file:
      - path: ../.env
        required: false
    environment:
      # AI 服务端口约定 8300（与 services/ai/.env.example 的 APP_PORT=8300 一致；
      # 实际绑定由 Dockerfile CMD 决定）
      APP_PORT: "8300"
      # AI 服务回调主服务内部 API（变量名与 AI 侧 config.py 对齐：
      # MAIN_SERVICE_INTERNAL_URL；方案 chapter_02：AI 结果一律回调主服务，不直接写库）
      MAIN_SERVICE_INTERNAL_URL: http://api:3000
      # R11：run 状态与回调死信落 AI 自有 Redis（db 3，键前缀 osai:）
      # 开发默认 auto（无 Redis 时降级 memory 并告警）；.env 里可改 redis 强制 fail-fast
      AI_RUN_STORE: ${AI_RUN_STORE:-auto}
      AI_STATE_REDIS_URL: redis://redis:6379/3
      # 模型配置由团队管理员在 Web「设置 → AI 模型」维护，随请求下发（无需在此配置 key）
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:8300:8300"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 可观测性（R9；profile=observability，默认不启动） ----------
  # 启用：pnpm docker:obs（= compose --profile observability up -d prometheus grafana）
  # Prometheus UI http://localhost:9090 · Grafana http://localhost:3001（admin / GRAFANA_ADMIN_PASSWORD）
  # 抓取配置 deploy/observability/prometheus.yml，告警规则 alerts.yml，看板自动 provision。
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: os-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:9090:9090"
    depends_on:
      api:
        condition: service_healthy

  # 告警路由（R9）：Prometheus → Alertmanager → alert-bridge → 飞书/钉钉/企业微信
  # Alertmanager UI http://localhost:9093；通道地址在 .env 的 ALERT_* 变量
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: os-alertmanager
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:9093:9093"
    depends_on:
      - alert-bridge

  alert-bridge:
    image: node:22-alpine
    container_name: os-alert-bridge
    profiles: ["observability"]
    command: ["node", "/app/server.mjs"]
    environment:
      ALERT_FEISHU_WEBHOOK: ${ALERT_FEISHU_WEBHOOK:-}
      ALERT_FEISHU_SECRET: ${ALERT_FEISHU_SECRET:-}
      ALERT_DINGTALK_WEBHOOK: ${ALERT_DINGTALK_WEBHOOK:-}
      ALERT_DINGTALK_SECRET: ${ALERT_DINGTALK_SECRET:-}
      ALERT_WECOM_WEBHOOK: ${ALERT_WECOM_WEBHOOK:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./observability/alert-bridge/server.mjs:/app/server.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9094/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.2.0
    container_name: os-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:3001:3000"   # 宿主 3001：避让 api 的 3000
    depends_on:
      - prometheus

  # ---------- mailpit（方案 B1：本地邮件 dev 服务；当前默认关闭） ----------
  # 启用方式：取消下方注释，并把 .env 中 SMTP_HOST 改为 mailpit、SMTP_PORT 保持 1025；
  # Web UI：http://localhost:8025
  # mailpit:
  #   image: axllent/mailpit:latest
  #   container_name: os-mailpit
  #   ports:
  #     - "1025:1025"   # SMTP
  #     - "8025:8025"   # Web UI

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
  alertmanagerdata:
