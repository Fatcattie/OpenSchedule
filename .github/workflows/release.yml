# ============================================================
# OpenSchedule CD 发布流水线（R10：CD 流水线 —— 镜像 + 迁移 job + staging 自动 / prod gate）
#
# 触发：推送 v* tag（例：v0.1.0）→ 构建并推送三镜像到 GHCR → staging 自动发布
#       → prod 需在 GitHub Environment「production」审批后发布（保护规则 = 人工 gate）
# 也支持手动 workflow_dispatch（可指定 tag，用于回滚到旧版本 = 重发旧 tag）。
#
# 与 ci.yml 的分工：ci.yml 是**门禁**（lint/build/test/audit/migration），本文件只负责**发布**。
# 前置：仓库 Settings → Environments 建 staging / production（production 加 Required reviewers）。
# 说明：迁移在目标机上经 compose `migrate` 服务执行（复用 api 镜像内的 prisma CLI，与运行时同版本），
#       不在 runner 上直连数据库——生产 PG 不对外暴露端口。所需 secrets 仅 SSH 三件套，无需 DATABASE_URL。
# ============================================================
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要发布的镜像 tag（回滚时填旧版本，如 v0.0.9）"
        required: true
        type: string

concurrency:
  # 同一环境串行发布，避免两次发布交叉滚动
  group: release-${{ github.event.inputs.image_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.ref_name }}

jobs:
  # ---------- 1. 构建 + 推送三镜像（api / web / ai） ----------
  build-images:
    name: Build & push images (${{ github.event.inputs.image_tag || github.ref_name }})
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.image_tag || github.ref }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Resolve image registry
        run: echo "registry=${REGISTRY,,}/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"

      # 生产镜像必须在 CI 构建（生产机只拉不可变 tag，不 build）
      - name: Build & push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.registry }}/openschedule-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web (prod target)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.registry }}/openschedule-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push ai
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/ai/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.registry }}/openschedule-ai:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  # ---------- 2. 部署（staging 自动；production 需审批） ----------
  # 迁移在目标机上执行：生产 PG 不对外暴露端口，GitHub runner 无法直连，故不设独立 runner 迁移 job。
  # 上线顺序：迁移（向后兼容，prisma migrate deploy 幂等）→ 迁移状态校验 → 应用滚动 → 冒烟；
  # 回滚时不回滚迁移（expand/contract 约定）。迁移/校验失败 → set -e 中止，不滚动应用。
  deploy:
    name: Deploy → ${{ matrix.environment }}
    needs: [build-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        environment: [staging]
    environment:
      name: ${{ matrix.environment }}
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy stack (compose pull + migrate + up)
        env:
          REGISTRY: ${{ needs.build-images.outputs.registry }}
          IMAGE_TAG: ${{ needs.build-images.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
            set -euo pipefail
            cd "\$HOME/openschedule"
            git fetch --all --tags && git checkout "$IMAGE_TAG" 2>/dev/null || true
            export REGISTRY="$REGISTRY" IMAGE_TAG="$IMAGE_TAG"
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml pull api web ai
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml --profile tools run --rm migrate
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml --profile tools run --rm migrate npx prisma migrate status
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d --remove-orphans
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml ps
          REMOTE

      - name: Smoke (health + version)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          # 发布后冒烟：health 全绿 + 首页 200（失败即视为本次发布失败，触发回滚处置）
          curl -fsS "$APP_URL/health" | tee /dev/stderr | grep -q '"status"'
          code="$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/")"
          test "$code" = "200"

  # ---------- 3. 生产发布（人工审批 gate；复用同一镜像 tag） ----------
  deploy-production:
    name: Deploy → production (needs approval)
    needs: [build-images, deploy]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Guard (must be a release tag)
        env:
          IMAGE_TAG: ${{ needs.build-images.outputs.tag }}
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in v*) echo "tag ok: $IMAGE_TAG" ;; *) echo "生产发布仅接受 v* tag：$IMAGE_TAG" >&2; exit 1 ;; esac
      - name: Deploy production stack
        env:
          REGISTRY: ${{ needs.build-images.outputs.registry }}
          IMAGE_TAG: ${{ needs.build-images.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
            set -euo pipefail
            cd "\$HOME/openschedule"
            git fetch --all --tags && git checkout "$IMAGE_TAG" 2>/dev/null || true
            export REGISTRY="$REGISTRY" IMAGE_TAG="$IMAGE_TAG"
            # 发布前备份（回滚兜底）：备份失败即中止发布
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml --profile ops up -d pg-backup
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml pull api web ai
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml --profile tools run --rm migrate
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml --profile tools run --rm migrate npx prisma migrate status
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d --remove-orphans
            docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml ps
          REMOTE
