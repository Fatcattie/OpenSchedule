openapi: 3.1.0
info:
  title: OpenSchedule Tenant AI Model API (contract slice F — llm routes)
  version: 1.3.0
  description: |
    Tenant AI model slice (D-14): a tenant admin configures one OpenAI-compatible
    model endpoint (provider preset or custom Base URL, model, API key) shared by
    the whole team. The key is uploaded once, stored AES-256-GCM encrypted and is
    never returned — every response exposes only the last 4 characters.
    Project decomposition forwards the decrypted config to the AI service per
    request (the AI service never persists it); AI rules / assistance text
    generation goes through POST /ai/complete so the browser never sees the key.

    Base URLs pass the SSRF guard on save and before every call (private,
    loopback and metadata addresses are rejected).
servers:
  - url: /api
    description: Same-origin API prefix used by the current web proxy
  - url: /api/v1
    description: Versioned NestJS API prefix used by the backend bootstrap

x-requirements:
  D-14:
    summary: Tenant-admin managed AI model key (no LiteLLM; AI service calls the vendor directly)
    paths: ["/settings/llm", "/settings/llm/providers", "/settings/llm/test", "/ai/status", "/ai/complete"]

security: []

paths:
  /settings/llm/providers:
    get:
      tags: [AI Model]
      operationId: listLlmProviders
      x-requirements: [D-14]
      summary: List supported vendor presets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Presets (DeepSeek / Zhipu GLM / Qwen / Kimi / OpenAI / custom)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LlmProviderPreset'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /settings/llm:
    get:
      tags: [AI Model]
      operationId: getLlmConfig
      x-requirements: [D-14]
      summary: Get the tenant AI model config (admin only; key masked)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current config (configured=false when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LlmAdminOnly'
    put:
      tags: [AI Model]
      operationId: saveLlmConfig
      x-requirements: [D-14]
      summary: Create or update the tenant AI model config (admin only)
      description: |
        apiKey 留空 = 保留已保存的 key（首次配置必填，否则 40001）。baseUrl 留空用厂商预设；
        custom 必填。审计 llm_config.update 只记末 4 位与 keyChanged。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLlmConfigRequest'
      responses:
        '200':
          description: Saved config (key masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmConfigResponse'
        '400':
          $ref: '#/components/responses/LlmBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LlmAdminOnly'
    delete:
      tags: [AI Model]
      operationId: deleteLlmConfig
      x-requirements: [D-14]
      summary: Remove the tenant AI model config (AI features fall back to local rules)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Removal result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [removed]
                    properties:
                      removed:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LlmAdminOnly'

  /settings/llm/test:
    post:
      tags: [AI Model]
      operationId: testLlmConfig
      x-requirements: [D-14]
      summary: Test the connection (fields fall back to the saved config)
      description: |
        发一次极短的 /chat/completions 请求（15s 超时）。上游失败以 200 + ok=false 返回
        中文原因（不回显 key 与上游响应体）。限流 10 次/分钟（租户+IP）。
        HTTP 状态沿用 NestJS POST 默认 201。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestLlmConfigRequest'
      responses:
        '201':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LlmTestResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LlmAdminOnly'

  /ai/status:
    get:
      tags: [AI Model]
      operationId: getAiStatus
      x-requirements: [D-14]
      summary: Whether the team has a real model configured (all members; no key data)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AiStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /ai/complete:
    post:
      tags: [AI Model]
      operationId: aiComplete
      x-requirements: [D-14]
      summary: Text generation with the team model (AI rules / assistance)
      description: |
        未配置 → 40910（409），前端回落本地规则引擎；上游失败 → 502（中文原因）。
        temperature 固定 ≤0.2，单次 60s 超时。限流 30 次/分钟（租户+IP）。
        HTTP 状态沿用 NestJS POST 默认 201。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 20000
                system:
                  type: string
                  maxLength: 8000
      responses:
        '201':
          description: Generated text
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [text, model, usage]
                    properties:
                      text:
                        type: string
                      model:
                        type: string
                      usage:
                        type: object
                        properties:
                          promptTokens:
                            type: integer
                          completionTokens:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: 团队未配置 AI 模型（40910）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: 模型服务调用失败（鉴权/额度/超时/地址不可用等，消息为中文原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer access token issued by POST /auth/login（见 auth.yaml）。
        全局 JwtAuthGuard，与其余域同一鉴权口径（R7-6 双鉴权收敛）。

  schemas:
    LlmProviderId:
      type: string
      enum: [deepseek, zhipu, qwen, moonshot, openai, custom]
    LlmProviderPreset:
      type: object
      required: [id, name, baseUrl, models]
      properties:
        id:
          $ref: '#/components/schemas/LlmProviderId'
        name:
          type: string
        baseUrl:
          type: string
          description: 默认端点（custom 为空串）
        models:
          type: array
          items:
            type: string
        consoleUrl:
          type: string
    LlmConfigView:
      type: object
      required: [configured, provider, providerName, baseUrl, model, keyLast4, updatedAt]
      properties:
        configured:
          type: boolean
        provider:
          oneOf:
            - $ref: '#/components/schemas/LlmProviderId'
            - type: 'null'
        providerName:
          type: [string, 'null']
        baseUrl:
          type: [string, 'null']
        model:
          type: [string, 'null']
        keyLast4:
          type: [string, 'null']
          description: key 末 4 位（不足 8 位时末 2 位）；明文/密文永不返回
        updatedAt:
          type: [string, 'null']
          format: date-time
    LlmConfigResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LlmConfigView'
    SaveLlmConfigRequest:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider:
          $ref: '#/components/schemas/LlmProviderId'
        baseUrl:
          type: string
          maxLength: 500
        model:
          type: string
          minLength: 1
          maxLength: 100
        apiKey:
          type: string
          maxLength: 500
          description: 留空 = 保留已保存的 key
    TestLlmConfigRequest:
      type: object
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/LlmProviderId'
        baseUrl:
          type: string
          maxLength: 500
        model:
          type: string
          maxLength: 100
        apiKey:
          type: string
          maxLength: 500
    LlmTestResult:
      oneOf:
        - type: object
          required: [ok, model, latencyMs]
          properties:
            ok:
              const: true
            model:
              type: string
            latencyMs:
              type: integer
        - type: object
          required: [ok, kind, message]
          properties:
            ok:
              const: false
            kind:
              type: string
              enum: [auth, rate_limited, timeout, unreachable, bad_request, upstream, invalid_response]
            message:
              type: string
    AiStatus:
      type: object
      required: [enabled, provider, providerName, model]
      properties:
        enabled:
          type: boolean
        provider:
          type: [string, 'null']
        providerName:
          type: [string, 'null']
        model:
          type: [string, 'null']

  responses:
    LlmAdminOnly:
      description: 仅团队管理员（tenant.owner / tenant.admin）可配置 AI 模型（40301）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    LlmBadRequest:
      description: 厂商不支持 / custom 缺地址 / 地址被 SSRF 守卫拒绝 / 首次配置缺 key（40001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
