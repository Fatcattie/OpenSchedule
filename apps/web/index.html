<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenSchedule — 团队协作 · 个人计划 · AI 增强" />
    <meta name="theme-color" content="#0e121c" />
    <title>OpenSchedule</title>
    <!-- 最小全局样式：AntD 布局依赖全高容器（PWA/样式系统定制为后续批次） -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0d14;
        color: #e8ecf2;
      }
      body {
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 运行时配置（错误上报 DSN 等）：生产由 nginx 启动脚本按环境变量生成，须先于入口脚本加载 -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
