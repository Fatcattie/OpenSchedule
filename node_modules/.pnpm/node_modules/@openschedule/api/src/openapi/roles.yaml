openapi: 3.1.0
info:
  title: OpenSchedule Roles and Capabilities API (contract slice B — roles routes)
  version: 1.3.0
  description: |
    Roles slice of the binding frontend↔backend contract. Covers FR-006 (no
    mock, localStorage identity, or identity-switching runtime path — the
    frontend derives what it may show from these server endpoints instead of
    selecting a fake identity), FR-007 (route, menu and action alignment: UI
    capability comes from the server, never from client-side role state),
    FR-008 (authorization and security test anchors — the fixed role enum and
    capability boundaries the tests assert), and FR-009 (personnel-management
    regression coverage). The enforceable permission matrix lives in
    permissions-matrix.yaml; RBAC rationale lives in
    docs/authorization/personnel-rbac.md.

    R7-6 双鉴权收敛：所有人员/角色/能力端点统一经全局 JwtAuthGuard（Bearer access token），
    不再走历史的 HttpOnly cookie 会话 + CSRF。
servers:
  - url: /api
    description: Same-origin API prefix used by the current web proxy
  - url: /api/v1
    description: Versioned NestJS API prefix used by the backend bootstrap

x-requirements:
  FR-006:
    summary: No mock, localStorage identity, or identity-switching runtime path
    paths: [/roles, /me/capabilities]
  FR-007:
    summary: Route, menu, and action capability alignment from server state
    paths: [/roles, /me/capabilities]
  FR-008:
    summary: Authorization and security test anchors
    paths: [/roles, /me/capabilities]
  FR-009:
    summary: Personnel-management regression coverage
    paths: [/roles, /me/capabilities]

security: []

paths:
  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      x-requirements: [FR-006, FR-007, FR-008, FR-009]
      summary: List the fixed authorization roles
      description: |
        Returns the three fixed roles super_admin, admin and member. The set
        is closed: the API never admits custom roles, and unknown role values
        are rejected everywhere they appear (FR-008). The frontend uses this
        to render role labels instead of hardcoding its own copy (FR-007).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fixed role catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/capabilities:
    get:
      tags: [Roles]
      operationId: getMyCapabilities
      x-requirements: [FR-006, FR-007, FR-008, FR-009]
      summary: Server-derived capability set for the current principal
      description: |
        Returns what the current session may do in personnel management:
        which actions are allowed and which target roles are manageable.
        admin receives member-only management; super_admin receives full
        admin+member management; member receives none. The frontend must
        derive route guards, menu entries and action buttons from this
        response — never from localStorage or an identity switcher (FR-006,
        FR-007). Server enforcement remains authoritative (FR-008).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Capability set for the current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer access token issued by POST /auth/login（见 auth.yaml）。
        R7-6 双鉴权收敛：历史 cookie session 已删除，统一走 Bearer。

  schemas:
    Role:
      type: string
      enum: [super_admin, admin, member]
      description: Fixed authorization role; no custom roles in this contract.
    RoleInfo:
      type: object
      additionalProperties: false
      required: [id, displayName, description, fixed]
      properties:
        id:
          $ref: '#/components/schemas/Role'
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          minLength: 1
          maxLength: 300
        fixed:
          const: true
          type: boolean
          description: Roles are enum-fixed; no runtime role creation exists.
    RolesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/RoleInfo'
    PersonnelCapability:
      type: object
      additionalProperties: false
      required: [list, create, update, setStatus, delete, assignRole, manageableRoles]
      properties:
        list:
          type: boolean
          description: May open the personnel-management route and list users.
        create:
          type: boolean
          description: May create users; the creatable role is bounded by manageableRoles.
        update:
          type: boolean
          description: May edit profile fields of manageable targets.
        setStatus:
          type: boolean
          description: May enable or disable manageable targets.
        delete:
          type: boolean
          description: May delete manageable targets.
        assignRole:
          type: boolean
          description: May change a target's role; super_admin only.
        manageableRoles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: |
            Target roles the current principal may manage. admin receives
            [member]; super_admin receives [admin, member]; member receives [].
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [userId, role, personnel]
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: '#/components/schemas/Role'
        personnel:
          $ref: '#/components/schemas/PersonnelCapability'
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details, traceId, requestId]
      properties:
        code:
          type: integer
          minimum: 400
          description: 分段业务错误码（权威定义 services/api/src/common/constants/error-codes.ts）：40001 校验 / 40101 认证 / 40301 权限 / 40401 不存在 / 40901 乐观锁 / 40902 非法状态迁移 / 42901 限流 / 50000 内部 / 502、503 依赖不可用
        message:
          type: string
          maxLength: 500
          description: 人类可读错误信息（5xx 不泄露内部细节）
        details:
          description: 结构化细节（默认空数组；校验错误为字段级数组；业务错误按码携带 allowed_transitions、key 等对象键）
        traceId:
          type: string
          minLength: 1
          maxLength: 128
          description: 链路追踪 ID（x-trace-id 请求头透传或服务端生成）
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: 请求 ID（与服务端日志、审计记录关联）

  responses:
    Unauthenticated:
      description: No valid active session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
