openapi: 3.1.0
info:
  title: OpenSchedule Permission Matrix API (contract slice B — boundary rules)
  version: 1.3.0
  description: |
    Machine-readable permission matrix and boundary rules — the enforceable
    core of slice B. Covers FR-006 (no client-side identity simulation may
    widen these rules), FR-007 (routes, menus and buttons are projections of
    this matrix), FR-008 (security tests assert these exact grants and
    denials, including admin_cannot_manage_admin and
    member_cannot_manage_users), and FR-009 (regression suites replay this
    matrix per release). The locked boundary decision: admin may manage
    member only; super_admin manages admin and member. Rationale lives in
    docs/authorization/personnel-rbac.md.

    R7-6 双鉴权收敛：所有人员域端点统一经全局 JwtAuthGuard（Bearer access token），
    不再走历史的 HttpOnly cookie 会话 + CSRF。
servers:
  - url: /api
    description: Same-origin API prefix used by the current web proxy
  - url: /api/v1
    description: Versioned NestJS API prefix used by the backend bootstrap

x-requirements:
  FR-006:
    summary: No mock, localStorage identity, or identity-switching runtime path
    paths: [/permissions/matrix]
  FR-007:
    summary: Route, menu, and action capability alignment
    paths: [/permissions/matrix]
  FR-008:
    summary: Authorization and security test anchors
    paths: [/permissions/matrix]
  FR-009:
    summary: Personnel-management regression coverage
    paths: [/permissions/matrix]

# Authoritative grants. Evaluation order: exact (action, actorRole,
# targetRole) match first, then actor defaults, then DEFAULT DENY.
# Every rule below is asserted by the FR-008 security suite.
x-permission-matrix:
  version: '1.1'
  roles: [super_admin, admin, member]
  actions: [user.list, user.read, user.create, user.update, user.set_status, user.delete, user.assign_role]
  boundary_decision: |
    admin may manage member only; super_admin manages admin and member.
    This is the confirmed-safe default against horizontal privilege
    escalation. Changing it is a contract change requiring matrix, tests,
    and UI updates together.
  rules:
    - { action: user.list,      actor: super_admin, target: admin,        effect: allow }
    - { action: user.list,      actor: super_admin, target: member,       effect: allow }
    - { action: user.list,      actor: admin,       target: member,       effect: allow }
    - { action: user.read,      actor: super_admin, target: admin,        effect: allow }
    - { action: user.read,      actor: super_admin, target: member,       effect: allow }
    - { action: user.read,      actor: admin,       target: member,       effect: allow }
    - { action: user.create,    actor: super_admin, target: admin,        effect: allow }
    - { action: user.create,    actor: super_admin, target: member,       effect: allow }
    - { action: user.create,    actor: admin,       target: member,       effect: allow }
    - { action: user.update,    actor: super_admin, target: admin,        effect: allow }
    - { action: user.update,    actor: super_admin, target: member,       effect: allow }
    - { action: user.update,    actor: admin,       target: member,       effect: allow }
    - { action: user.set_status, actor: super_admin, target: admin,       effect: allow }
    - { action: user.set_status, actor: super_admin, target: member,      effect: allow }
    - { action: user.set_status, actor: admin,       target: member,      effect: allow }
    - { action: user.delete,    actor: super_admin, target: admin,        effect: allow }
    - { action: user.delete,    actor: super_admin, target: member,       effect: allow }
    - { action: user.delete,    actor: admin,       target: member,       effect: allow }
    - { action: user.assign_role, actor: super_admin, target: admin,      effect: allow }
    - { action: user.assign_role, actor: super_admin, target: member,     effect: allow }
    # Explicit boundary denials — the locked horizontal-escalation guard.
    - { action: user.list,      actor: admin,       target: admin,        effect: deny }
    - { action: user.read,      actor: admin,       target: admin,        effect: deny }
    - { action: user.create,    actor: admin,       target: admin,        effect: deny }
    - { action: user.update,    actor: admin,       target: admin,        effect: deny }
    - { action: user.set_status, actor: admin,       target: admin,       effect: deny }
    - { action: user.delete,    actor: admin,       target: admin,        effect: deny }
    - { action: user.assign_role, actor: admin,     target: admin,        effect: deny }
    - { action: user.assign_role, actor: admin,     target: member,       effect: deny }
    # member has no personnel-management rights at all.
    - { action: user.list,      actor: member,      target: admin,        effect: deny }
    - { action: user.list,      actor: member,      target: member,       effect: deny }
    - { action: user.read,      actor: member,      target: admin,        effect: deny }
    - { action: user.read,      actor: member,      target: member,       effect: deny }
    - { action: user.create,    actor: member,      target: admin,        effect: deny }
    - { action: user.create,    actor: member,      target: member,       effect: deny }
    - { action: user.update,    actor: member,      target: admin,        effect: deny }
    - { action: user.update,    actor: member,      target: member,       effect: deny }
    - { action: user.set_status, actor: member,      target: admin,       effect: deny }
    - { action: user.set_status, actor: member,      target: member,      effect: deny }
    - { action: user.delete,    actor: member,      target: admin,        effect: deny }
    - { action: user.delete,    actor: member,      target: member,       effect: deny }
    - { action: user.assign_role, actor: member,    target: admin,        effect: deny }
    - { action: user.assign_role, actor: member,    target: member,       effect: deny }
  invariants:
    - id: default_deny
      statement: Any (action, actor, target) without an explicit allow rule is denied.
    - id: last_super_admin_guard
      statement: The final active super_admin cannot be disabled, deleted, or demoted by any flow.
    - id: no_self_escalation_via_payload
      statement: role, status, or id values in request payloads can never widen the caller's scope; authorization uses the persisted target snapshot.
    - id: unknown_role_rejected
      statement: Unknown or missing roles are rejected at the schema and database layers.
    - id: hidden_ui_is_not_authorization
      statement: Hiding a route, menu entry, or button is a UX projection only; the API re-evaluates this matrix on every request.

security: []

paths:
  /permissions/matrix:
    get:
      tags: [Permissions]
      operationId: getPermissionMatrix
      x-requirements: [FR-006, FR-007, FR-008, FR-009]
      summary: Read the machine-readable permission matrix
      description: |
        Returns the fixed roles, the action catalog and the explicit
        allow/deny grants evaluated by the authorization policy. The frontend
        may cache it for rendering but must never treat it as the security
        boundary; every mutating request is re-evaluated server-side (FR-006,
        FR-008). Regression suites compare live behavior against this matrix
        (FR-009).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The permission matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionMatrixResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer access token issued by POST /auth/login。
        R7-6 双鉴权收敛：历史 cookie session 已删除。

  schemas:
    Role:
      type: string
      enum: [super_admin, admin, member]
    PermissionEffect:
      type: string
      enum: [allow, deny]
    PermissionRule:
      type: object
      additionalProperties: false
      required: [action, actor, target, effect]
      properties:
        action:
          type: string
          enum: [user.list, user.read, user.create, user.update, user.set_status, user.delete, user.assign_role]
        actor:
          $ref: '#/components/schemas/Role'
        target:
          $ref: '#/components/schemas/Role'
        effect:
          $ref: '#/components/schemas/PermissionEffect'
    PermissionMatrix:
      type: object
      additionalProperties: false
      required: [version, roles, actions, boundary_decision, rules]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 20
        roles:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/Role'
        actions:
          type: array
          minItems: 1
          items:
            type: string
        boundary_decision:
          type: string
          minLength: 1
          maxLength: 500
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PermissionRule'
    PermissionMatrixResponse:
      type: object
      additionalProperties: false
      required: [matrix]
      properties:
        matrix:
          $ref: '#/components/schemas/PermissionMatrix'
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details, traceId, requestId]
      properties:
        code:
          type: integer
          minimum: 400
          description: 分段业务错误码（权威定义 services/api/src/common/constants/error-codes.ts）：40001 校验 / 40101 认证 / 40301 权限 / 40401 不存在 / 40901 乐观锁 / 40902 非法状态迁移 / 42901 限流 / 50000 内部 / 502、503 依赖不可用
        message:
          type: string
          maxLength: 500
          description: 人类可读错误信息（5xx 不泄露内部细节）
        details:
          description: 结构化细节（默认空数组；校验错误为字段级数组；业务错误按码携带 allowed_transitions、key 等对象键）
        traceId:
          type: string
          minLength: 1
          maxLength: 128
          description: 链路追踪 ID（x-trace-id 请求头透传或服务端生成）
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: 请求 ID（与服务端日志、审计记录关联）

  responses:
    Unauthenticated:
      description: No valid active session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
