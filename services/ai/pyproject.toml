# OpenSchedule AI 服务（services/ai）
# FastAPI + LangGraph + LiteLLM；Python 3.12；Pydantic v2 strict 模式
# 职责：拆解/评估/应急/执行（Phase 1 仅拆解草稿闭环）；铁律：AI 提议、人确认；永不直连业务库

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openschedule-ai-service"
version = "0.1.0"
description = "OpenSchedule AI 服务：拆解/评估/应急/执行（FastAPI + LangGraph + LiteLLM）；AI 提议、人确认；永不直连业务库"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",          # API 框架
    "uvicorn[standard]>=0.30", # ASGI 服务器
    "pydantic>=2.8",           # v2 strict schema（L1 校验基础）
    "pydantic-settings>=2.3",  # 配置类（读取 .env）
    "langgraph>=0.2.30",       # 图编排（plan→validate→emit；Phase 3 interrupt 审批）
    "httpx>=0.27",             # 调 LiteLLM + 回调主服务 /internal/ai/results
    "python-dotenv>=1.0",      # .env 加载
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends 允许写在默认参数里
