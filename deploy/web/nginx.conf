# ============================================================
# OpenSchedule 前端生产站点（nginx；R10 web 生产镜像）
# 挂载位置：apps/web/Dockerfile 的 prod 目标 → /etc/nginx/conf.d/default.conf
# 职责：托管 Vite 构建产物（/usr/share/nginx/html）+ SPA 路由回退 + 缓存/安全头
# 注意：API 反向代理**不在本文件**（由 Caddy 统一终结 TLS 并转发 /api/* → api:3000），
#       nginx 只负责静态文件，避免两层代理带来的路径/头部歧义。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 内容安全策略（安全问题 L-3）：脚本只允许同源（无内联脚本、无 eval）；
    # style 'unsafe-inline' 为 AntD CSS-in-JS 与 index.html 内联样式所需；
    # connect-src https: 为 Sentry 上报（DSN 主机按部署而定），同源 REST / socket.io 由 'self' 覆盖
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # 容器健康检查端点（apps/web/Dockerfile HEALTHCHECK 探测）
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带指纹的构建产物：一年不可变缓存（Vite 产物文件名含内容 hash）
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 运行时配置（启动时按环境变量生成）：不缓存，改配置重启即生效
    location = /runtime-config.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 其余静态资源（favicon/robots 等）
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|css|js|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA 路由回退：入口文档不缓存，保证发版即时生效（否则用户拿到旧 index 引用已删除的 assets）
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        # 注意：location 内一旦有 add_header 就不再继承 server 级 add_header，安全头须在此重复声明
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # —— 安全头（TLS 由 Caddy 终结；HSTS 在 Caddy 侧下发，避免双重 HSTS 冲突）——
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # 静态站点无需请求体
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
